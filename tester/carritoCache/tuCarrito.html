
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Tu carrito</title>
  <link rel="stylesheet" href="estiloEjercicios.css">

</head>
<body>
  <h1>Tu carrito</h1>
  <ul id="listaCarrito"></ul>
  <p id="total"></p>

  <div class="acciones-global">
    <button id="vaciar">Vaciar carrito</button>
    <a href="productosCache.html"><button>Seguir comprando</button></a>
  </div>

  <script>
    const lista = document.getElementById('listaCarrito');
    const total = document.getElementById('total');
    const btnVaciar = document.getElementById('vaciar');

    // Obtener el carrito del localStorage
    function obtenerCarrito() {
      return JSON.parse(localStorage.getItem('carrito')) || [];
    }

    // Guardar el carrito actualizado
    function guardarCarrito(carrito) {
      localStorage.setItem('carrito', JSON.stringify(carrito));
    }

    // Mostrar el carrito
    function mostrarCarrito() {
      const carrito = obtenerCarrito();
      lista.innerHTML = '';
      let suma = 0;

      carrito.forEach((prod, index) => {
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="info">
            <strong>${prod.nombre}</strong><br>
            $${prod.precio} c/u
          </div>
          <div class="acciones-cantidad">
            <button class="restar" onclick="cambiarCantidad(${index}, -1)">–</button>
            <span>${prod.cantidad}</span>
            <button class="sumar" onclick="cambiarCantidad(${index}, 1)">+</button>
            <button class="eliminar" onclick="eliminarProducto(${index})">Eliminar</button>
          </div>
        `;
        lista.appendChild(li);
        suma += prod.precio * prod.cantidad;
      });

      total.textContent = carrito.length ? `Total: $${suma}` : 'El carrito está vacío.';
    }

    // Cambiar cantidad de un producto
    function cambiarCantidad(indice, cambio) {
      let carrito = obtenerCarrito();
      carrito[indice].cantidad += cambio;

      // Si la cantidad llega a 0, eliminar el producto
      if (carrito[indice].cantidad <= 0) {
        carrito.splice(indice, 1);
      }

      guardarCarrito(carrito);
      mostrarCarrito();
    }

    // Eliminar producto individual
    function eliminarProducto(indice) {
      let carrito = obtenerCarrito();
      carrito.splice(indice, 1);
      guardarCarrito(carrito);
      mostrarCarrito();
    }

    // Vaciar todo el carrito
    btnVaciar.addEventListener('click', () => {
      localStorage.removeItem('carrito');
      mostrarCarrito();
    });

    // Mostrar al cargar la página
    mostrarCarrito();
  </script>
</body>
</html>
